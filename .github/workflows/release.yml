name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: binary
            goos: linux
            goarch: amd64
          - target: binary
            goos: linux
            goarch: arm64
          - target: binary
            goos: windows
            goarch: amd64
          - target: docker
            platform: linux/amd64
          - target: docker
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
