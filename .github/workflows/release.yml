name: Release

on:
  release:
    types: [created]
  workflow_dispatch:

permissions:
  contents: write
  packages: write

jobs:
  build-and-upload:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: binary
            goos: linux
            goarch: amd64
          - target: binary
            goos: linux
            goarch: arm64
          - target: binary
            goos: windows
            goarch: amd64
          - target: docker
            platform: linux/amd64
          - target: docker
            platform: linux/arm64

    steps:
      - uses: actions/checkout@v4

      - name: Extract version from tag
        id: version
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        if: matrix.target == 'docker'
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        if: matrix.target == 'docker'
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        if: matrix.target == 'docker'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        if: matrix.target == 'docker' && matrix.platform == 'linux/amd64'
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            zhf883680/clash-subscription-manager:${{ steps.version.outputs.version }}
            zhf883680/clash-subscription-manager:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Set up Go
        if: matrix.target == 'binary'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build binary
        if: matrix.target == 'binary'
        run: |
          VERSION=${{ steps.version.outputs.version }}
          VERSION=${VERSION#refs/tags/}
          VERSION=${VERSION#v}

          OUTPUT_NAME=clash-subscription-manager-${{ matrix.goos }}-${{ matrix.goarch }}
          if [ "${{ matrix.goos }}" = "windows" ]; then
            OUTPUT_NAME="${OUTPUT_NAME}.exe"
          fi

          echo "Building $OUTPUT_NAME version $VERSION"
          CGO_ENABLED=0 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} \
            go build -ldflags="-s -w -X main.Version=$VERSION" \
            -o $OUTPUT_NAME .

          chmod +x $OUTPUT_NAME || true

      - name: Upload to Release
        if: matrix.target == 'binary'
        uses: softprops/action-gh-release@v2
        with:
          files: clash-subscription-manager-*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
